apiVersion: apps/v1
kind: Deployment
metadata:
  name: button-click-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: button-click-web
  template:
    metadata:
      labels:
        app: button-click-web
    spec:
      containers:
      - name: button-click-web
        image: button-click-web:1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: button-click-web-service
spec:
  type: NodePort
  selector:
    app: button-click-web
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30015
